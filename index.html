<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch1noNews</title>
    <!-- Libreria per il parsing del Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 15px; width: 100vw; overflow-x: hidden; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding: 0 10px;
        }
        .header-title h1 { font-size: 1.8rem; color: #ff4757; }
        .header-title p { color: #aaa; font-size: 0.85rem; font-style: italic; }

        .region-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1e1e1e;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #333;
        }
        .region-btn {
            font-size: 1.6rem;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s, transform 0.2s;
            user-select: none;
        }
        .region-btn:hover { transform: scale(1.2); }
        .region-btn.active { opacity: 1; transform: scale(1.1); }

        .help-btn {
            font-size: 1.2rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            user-select: none;
            padding: 0 4px;
        }
        .help-btn:hover { color: #fff; transform: scale(1.2); }

        .rating-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
            flex-wrap: wrap;
        }
        .score-wrapper {
            position: relative;
            display: inline-block;
        }
        /* Tooltip per i tasti 1 e 9 */
        .score-wrapper .tooltip {
            visibility: hidden;
            width: max-content;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 4px 8px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.75rem;
            pointer-events: none;
            border: 1px solid #444;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .score-wrapper:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .btn-score {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .btn-score:hover { transform: scale(1.15); }
        .btn-score.active { outline: 3px solid #fff; transform: scale(1.1); }

        .score-1 { background-color: #d9534f; }
        .score-2 { background-color: #e06d53; }
        .score-3 { background-color: #e68758; }
        .score-4 { background-color: #eca15c; }
        .score-5 { background-color: #f0ad4e; }
        .score-6 { background-color: #b7b852; }
        .score-7 { background-color: #7ec256; }
        .score-8 { background-color: #5cb85c; }
        .score-9 { background-color: #2b982b; }

        /* Full Width Layout */
        .main-container {
            display: grid;
            grid-template-columns: 35% 65%;
            gap: 15px;
            width: 100%;
            height: calc(100vh - 150px);
        }
        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; height: auto; }
        }

        .news-list {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            overflow-y: auto;
            height: 100%;
            border: 1px solid #2a2a2a;
        }
        .news-item {
            padding: 12px;
            border-bottom: 1px solid #2c2c2c;
            cursor: pointer;
            border-radius: 4px;
        }
        .news-item:hover { background: #282828; }
        .news-item.selected { background: #333333; border-left: 4px solid #ff4757; }
        .news-item h3 { font-size: 0.95rem; color: #4da6ff; margin-bottom: 6px; line-height: 1.3; }
        
        .source-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #888;
        }
        .favicon-img { width: 16px; height: 16px; border-radius: 2px; }

        .news-viewer {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid #2a2a2a;
        }
        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }
        .viewer-controls {
            display: flex;
            gap: 8px;
        }
        .btn-view {
            padding: 5px 10px;
            background: #333;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .btn-view.active { background: #007bff; color: white; border-color: #0056b3; }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
            background: #fff;
        }
        .placeholder-text { color: #777; text-align: center; margin: auto; }

        /* Modal Info Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            padding: 20px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            line-height: 1.6;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #fff; }

        /* Markdown Styles Inside Modal */
        .markdown-body * {
            font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', cursive;
        }
        
        /* Colori trasversali e differenti per ogni livello di titolo (#, ##, ###, ecc.) */
        .markdown-body h1 { 
            color: #ff4757; /* Rosso brillante per H1 (#) */
            margin-bottom: 12px; 
            border-bottom: 2px solid #ff4757;
            padding-bottom: 6px;
        }
        .markdown-body h2 { 
            color: #ffa502; /* Arancione per H2 (##) */
            margin-top: 16px;
            margin-bottom: 12px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 6px; 
        }
        .markdown-body h3 { 
            color: #2ed573; /* Verde smeraldo per H3 (###) */
            margin-top: 14px; 
            margin-bottom: 6px; 
        }
        .markdown-body h4 { 
            color: #1e90ff; /* Blu per H4 (####) */
            margin-top: 12px; 
            margin-bottom: 6px; 
        }
        
        .markdown-body p { margin-bottom: 10px; color: #ddd; font-size: 0.95rem; }
        .markdown-body ul { margin-left: 20px; margin-bottom: 10px; color: #ddd; }
        .markdown-body code { background: #2a2a2a; padding: 2px 5px; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-title">
            <h1>ch1noNews</h1>
        </div>
        <div class="region-selector">
            <span class="region-btn active" id="btn-global" onclick="setRegion('GLOBAL')" title="Mondo (Tradotto in IT)">🌐</span>
            <span class="region-btn" id="btn-it" onclick="setRegion('IT')" title="Italia">🇮🇹</span>
            <span class="help-btn" onclick="openModal()" title="Info e Istruzioni">?</span>
        </div>
    </div>

    <div class="rating-bar" id="rating-bar"></div>

    <div class="main-container">
        <div class="news-list" id="news-list">
            <p class="placeholder-text">Caricamento notizie...</p>
        </div>

        <div class="news-viewer">
            <div class="viewer-header">
                <span id="viewer-title" style="font-weight: bold; font-size:0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Seleziona una notizia</span>
                <div class="viewer-controls" id="controls" style="display:none;">
                    <button id="btn-proxy" class="btn-view active" onclick="switchMode('proxy')">Proxy (Periscope)</button>
                    <button id="btn-direct" class="btn-view" onclick="switchMode('direct')">Sito Diretto</button>
                    <a id="external-link" class="btn-view" href="#" target="_blank">Apri Scheda ↗</a>
                </div>
            </div>
            <iframe id="news-frame" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Modal Info -->
    <div class="modal-overlay" id="info-modal" onclick="closeModalOnOverlay(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="markdown-body" id="modal-markdown-content"></div>
        </div>
    </div>

    <script>
        let rawNewsData = [];
        let selectedScore = 5;
        let selectedRegion = 'GLOBAL';
        let currentArticle = null;
        let currentMode = 'proxy';

        // Testo delle istruzioni formattato in Markdown
        const infoMarkdown = `
# 📰 Benvenuto su ch1noNews!

---

## Cos'è?
Ch1noNews, o Notiziello, è un aggregatore di notizie inchinellite

---

## Come funziona?
🗞️ Una serie di notizie vengono prese tramite più API <br>
🤖 viene poi chiesto a Gemini per ogni notizia un grado di inchinellitudine <br>
📖 utilizzando la <a href="https://slengo.it/define/inchinellito" target="_blank" style="font-family: 'Comic Sans MS', 'Comic Sans', cursive; color: #48e704;">definizione ufficiale</a> del termine 

---

## Funziona?
❌ No, a volte puoi trovare delle notizie inchinellite anche nei gradi più bassi,
ma è ottimo per farsi una risata in compagnia 
<img src="https://i.imgur.com/M7lYDss.png" alt="anche di ronny" width="450" style="border-radius: 12px; border: 2px solid #ff4757;">

---

## Feature interessanti?

### Filtro notizie
Puoi filtrare le notizie per 
- <img src="https://flagcdn.com/w20/it.png" alt="Italia" width="20"> Internazionali 
- 🌐 Globali  

### Proxy
Puoi leggere le notizie
- 🔌 Embeddate tramite un proxy che elimina i pop-up fastidiosi
- ➘ Embeddate senza il proxy (necessario per alcuni giornali come open.online)
- ↗ Aprendo l'articolo originale in una nuova scheda 
        `;

        function initRatingBar() {
            const bar = document.getElementById('rating-bar');
            for (let i = 1; i <= 9; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'score-wrapper';

                const btn = document.createElement('button');
                btn.className = `btn-score score-${i} ${i === 5 ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => selectScore(i);

                wrapper.appendChild(btn);

                // Tooltip personalizzati per 1 e 9
                if (i === 1 || i === 9) {
                    const tooltip = document.createElement('span');
                    tooltip.className = 'tooltip';
                    tooltip.innerText = i === 1 ? 'Nanni polemica - cicciona e noiosa' : 'Full inchinellito - magra e divertente';
                    wrapper.appendChild(tooltip);
                }

                bar.appendChild(wrapper);
            }
        }

        function selectScore(score) {
            selectedScore = score;
            document.querySelectorAll('.btn-score').forEach((btn) => {
                btn.classList.toggle('active', parseInt(btn.innerText) === score);
            });
            renderNews();
        }

        function setRegion(region) {
            selectedRegion = region;
            document.getElementById('btn-global').classList.toggle('active', region === 'GLOBAL');
            document.getElementById('btn-it').classList.toggle('active', region === 'IT');
            renderNews();
        }

        async function loadNewsData() {
            try {
                const response = await fetch('./data/news.json');
                rawNewsData = await response.json();
                renderNews();
            } catch (error) {
                document.getElementById('news-list').innerHTML = 
                    "<p class='placeholder-text'>Nessun dato disponibile. Esegui la Action su GitHub!</p>";
            }
        }

        function renderNews() {
            const listEl = document.getElementById('news-list');
            listEl.innerHTML = "";
        
            const filtered = rawNewsData.filter(item => {
                const matchesScore = item.score === selectedScore;
                const matchesRegion = (selectedRegion === 'IT') ? (item.region === 'IT') : (item.region === 'GLOBAL');
                return matchesScore && matchesRegion;
            });
        
            if (filtered.length === 0) {
                listEl.innerHTML = `<p class='placeholder-text'>Nessuna notizia trovata per il livello ${selectedScore} nella sezione selezionata.</p>`;
                return;
            }
        
            filtered.forEach(article => {
                const div = document.createElement('div');
                div.className = 'news-item';
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${article.domain}&sz=32`;
        
                div.innerHTML = `
                    <h3>${article.title}</h3>
                    <div class="source-container">
                        <img class="favicon-img" src="${faviconUrl}" alt="" />
                        <span>${article.domain}</span>
                    </div>
                `;
        
                div.onclick = () => {
                    document.querySelectorAll('.news-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    
                    currentArticle = article;
                    document.getElementById('viewer-title').innerText = article.title;
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('external-link').href = article.url;
                    
                    loadArticleInFrame();
                };
                listEl.appendChild(div);
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-proxy').classList.toggle('active', mode === 'proxy');
            document.getElementById('btn-direct').classList.toggle('active', mode === 'direct');
            loadArticleInFrame();
        }

        function loadArticleInFrame() {
            if (!currentArticle) return;
            const iframe = document.getElementById('news-frame');
            if (currentMode === 'proxy') {
                iframe.src = `https://periscope.corsfix.com/?${currentArticle.url}`;
            } else {
                iframe.src = currentArticle.url;
            }
        }

        // Funzioni Modale Info
        function openModal() {
            document.getElementById('info-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('info-modal').style.display = 'none';
        }

        function closeModalOnOverlay(event) {
            if (event.target.id === 'info-modal') {
                closeModal();
            }
        }

        // Renderizzo il markdown del modale all'avvio
        document.getElementById('modal-markdown-content').innerHTML = marked.parse(infoMarkdown);

        initRatingBar();
        loadNewsData();
    </script>
</body>
</html>
