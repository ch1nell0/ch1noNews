<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch1noNews: notizie inchinellite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1300px;
            margin: 0 auto 20px auto;
        }
        .header-title h1 { font-size: 2rem; color: #ff4757; }
        .header-title p { color: #aaa; font-size: 0.9rem; font-style: italic; }

        .region-selector {
            display: flex;
            gap: 12px;
            background: #1e1e1e;
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #333;
        }
        .region-btn {
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s, transform 0.2s;
            user-select: none;
        }
        .region-btn:hover { transform: scale(1.2); }
        .region-btn.active { opacity: 1; transform: scale(1.1); }

        .rating-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .btn-score {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .btn-score:hover { transform: scale(1.15); }
        .btn-score.active { outline: 3px solid #fff; transform: scale(1.1); }

        .score-1 { background-color: #d9534f; }
        .score-2 { background-color: #e06d53; }
        .score-3 { background-color: #e68758; }
        .score-4 { background-color: #eca15c; }
        .score-5 { background-color: #f0ad4e; }
        .score-6 { background-color: #b7b852; }
        .score-7 { background-color: #7ec256; }
        .score-8 { background-color: #5cb85c; }
        .score-9 { background-color: #2b982b; }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        @media (max-width: 850px) { .main-container { grid-template-columns: 1fr; } }

        .news-list {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            max-height: 75vh;
            overflow-y: auto;
        }
        .news-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            border-radius: 4px;
        }
        .news-item:hover { background: #2a2a2a; }
        .news-item h3 { font-size: 0.95rem; color: #4da6ff; margin-bottom: 6px; }
        
        .source-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #888;
        }
        .favicon-img {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }

        .news-viewer {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 75vh;
        }
        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .viewer-header a {
            padding: 6px 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: 1px solid #333;
            border-radius: 4px;
            background: #fff;
        }
        .placeholder-text { color: #777; text-align: center; margin: auto; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-title">
            <h1>ch1noNews: notizie inchinellite</h1>
            <p>1 = serio/tragico | 9 = full inchinellito</p>
        </div>
        <div class="region-selector">
            <span class="region-btn active" id="btn-global" onclick="setRegion('GLOBAL')" title="Mondo">🌐</span>
            <span class="region-btn" id="btn-it" onclick="setRegion('IT')" title="Italia">🇮🇹</span>
        </div>
    </div>

    <div class="rating-bar" id="rating-bar"></div>

    <div class="main-container">
        <div class="news-list" id="news-list">
            <p class="placeholder-text">Caricamento notizie...</p>
        </div>

        <div class="news-viewer">
            <div class="viewer-header">
                <span id="viewer-title" style="font-weight: bold; font-size:0.9rem;">Seleziona una notizia</span>
                <a id="external-link" href="#" target="_blank" style="display: none;">Apri in un'altra scheda ↗</a>
            </div>
            <iframe id="news-frame" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        let rawNewsData = [];
        let selectedScore = 5;
        let selectedRegion = 'GLOBAL';

        function initRatingBar() {
            const bar = document.getElementById('rating-bar');
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = `btn-score score-${i} ${i === 5 ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => selectScore(i);
                bar.appendChild(btn);
            }
        }

        function selectScore(score) {
            selectedScore = score;
            document.querySelectorAll('.btn-score').forEach((btn, idx) => {
                btn.classList.toggle('active', (idx + 1) === score);
            });
            renderNews();
        }

        function setRegion(region) {
            selectedRegion = region;
            document.getElementById('btn-global').classList.toggle('active', region === 'GLOBAL');
            document.getElementById('btn-it').classList.toggle('active', region === 'IT');
            renderNews();
        }

        async function loadNewsData() {
            try {
                const response = await fetch('./data/news.json');
                rawNewsData = await response.json();
                renderNews();
            } catch (error) {
                document.getElementById('news-list').innerHTML = 
                    "<p class='placeholder-text'>Nessun dato ancora disponibile. Esegui la Action su GitHub!</p>";
            }
        }

        function renderNews() {
            const listEl = document.getElementById('news-list');
            listEl.innerHTML = "";

            const filtered = rawNewsData.filter(item => {
                const matchesScore = item.score === selectedScore;
                const matchesRegion = (selectedRegion === 'GLOBAL') ? true : (item.region === 'IT');
                return matchesScore && matchesRegion;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class='placeholder-text'>Nessuna notizia trovata per il livello ${selectedScore}. Prova un altro numero o seleziona l'icona Mondo 🌐.</p>`;
                return;
            }

            filtered.forEach(article => {
                const div = document.createElement('div');
                div.className = 'news-item';
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${article.domain}&sz=32`;

                div.innerHTML = `
                    <h3>${article.title}</h3>
                    <div class="source-container">
                        <img class="favicon-img" src="${faviconUrl}" alt="" />
                        <span>${article.domain}</span>
                    </div>
                `;
                
                div.onclick = () => {
                    document.getElementById('viewer-title').innerText = article.title;
                    
                    // Link per apertura diretta in una nuova scheda
                    const link = document.getElementById('external-link');
                    link.href = article.url;
                    link.style.display = 'inline-block';
                
                    // EMBED DIRETTO: Concatenazione pulita periscope + URL reale dell'articolo
                    document.getElementById('news-frame').src = `https://periscope.corsfix.com/?${article.url}`;
                };
                listEl.appendChild(div);
            });
        }

        initRatingBar();
        loadNewsData();
    </script>
</body>
</html>
